[project]
name = "examen-bentoml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bentoml>=1.4.40",
    "pandas>=3.1.1",
    "pyjwt>=2.15.1",
    "scikit-learn>=1.9.1",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Disable fix for unused imports (`F401`).
unfixable = ["F401"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "requests>=2.34.2",
]
